name: "Data Ingestion & Workflow Execution"

on:
  workflow_dispatch:
    inputs:
      trigger_glue_workflow:
        description: "Trigger Glue Workflow after upload (true/false)"
        required: false
        default: "true"

jobs:
  ingest-and-trigger:
    name: "Kaggle Ingestion to S3"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Run Kaggle Data Ingestion Script
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TRIGGER_GLUE_WORKFLOW: ${{ github.event.inputs.trigger_glue_workflow }}
        run: |
          python ingestion/ingest.py
