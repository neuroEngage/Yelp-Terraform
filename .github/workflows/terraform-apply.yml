name: "Deploy & Ingest Pipeline"

# ──────────────────────────────────────────────────────────────────────────
# Trigger: every push to main  OR  manual button click in GitHub Actions UI
# ──────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1 — Terraform: provision S3 buckets + Glue infra
  # ────────────────────────────────────────────────────────────────────────
  terraform:
    name: "1 · Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    outputs:
      bronze_bucket: ${{ steps.tf_outputs.outputs.bronze_bucket }}
      glue_workflow: ${{ steps.tf_outputs.outputs.glue_workflow }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version:             1.5.7
          cli_config_credentials_token:  ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper:             false   # needed to capture outputs cleanly

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Capture Terraform Outputs
        id: tf_outputs
        run: |
          echo "bronze_bucket=$(terraform output -raw bronze_bucket_name)" >> $GITHUB_OUTPUT
          echo "glue_workflow=$(terraform output -raw glue_workflow_name)"  >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2 — Ingest: download from Kaggle → upload to Bronze S3 → trigger Glue
  # Runs only after Terraform succeeds
  # ────────────────────────────────────────────────────────────────────────
  ingest:
    name: "2 · Kaggle Ingest → S3 Bronze → Glue"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Run Ingestion Script
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          BRONZE_BUCKET_NAME: ${{ needs.terraform.outputs.bronze_bucket }}
          GLUE_WORKFLOW_NAME: ${{ needs.terraform.outputs.glue_workflow }}
          TRIGGER_GLUE:       "true"
        run: python ingestion/ingest.py
