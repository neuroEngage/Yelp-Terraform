name: "Deploy & Ingest Pipeline"

# ──────────────────────────────────────────────────────────────────────────
# Trigger: every push to main  OR  manual button click in GitHub Actions UI
# ──────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1 — Terraform: provision S3 buckets + Glue infra
  # ────────────────────────────────────────────────────────────────────────
  terraform:
    name: "1 · Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra

    outputs:
      bronze_bucket:    ${{ steps.tf_outputs.outputs.bronze_bucket }}
      silver_bucket:    ${{ steps.tf_outputs.outputs.silver_bucket }}
      gold_bucket:      ${{ steps.tf_outputs.outputs.gold_bucket }}
      glue_workflow:    ${{ steps.tf_outputs.outputs.glue_workflow }}
      silver_crawler:   ${{ steps.tf_outputs.outputs.silver_crawler }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version:             1.5.7
          cli_config_credentials_token:  ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper:             false   # needed to capture outputs cleanly

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Capture Terraform Outputs
        id: tf_outputs
        run: |
          echo "bronze_bucket=$(terraform output -raw bronze_bucket_name)"        >> $GITHUB_OUTPUT
          echo "silver_bucket=$(terraform output -raw silver_bucket_name)"        >> $GITHUB_OUTPUT
          echo "gold_bucket=$(terraform output -raw gold_bucket_name)"            >> $GITHUB_OUTPUT
          echo "glue_workflow=$(terraform output -raw glue_workflow_name)"        >> $GITHUB_OUTPUT
          echo "silver_crawler=$(terraform output -raw glue_silver_crawler_name)" >> $GITHUB_OUTPUT

      - name: Upload Glue Scripts to S3
        # Upload Glue ETL scripts from the runner to the Bronze S3 scripts/ prefix.
        # Uses the captured bronze_bucket output so we don't re-invoke terraform.
        working-directory: .
        run: |
          BRONZE_BUCKET="${{ steps.tf_outputs.outputs.bronze_bucket }}"
          echo "Uploading Glue scripts to s3://${BRONZE_BUCKET}/scripts/"
          aws s3 cp glue/scripts/bronze_to_silver.py s3://${BRONZE_BUCKET}/scripts/bronze_to_silver.py
          aws s3 cp glue/scripts/silver_to_gold.py   s3://${BRONZE_BUCKET}/scripts/silver_to_gold.py
          echo "All Glue ETL scripts uploaded successfully."

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2 — Ingest: download from Kaggle → upload to Bronze S3 → trigger Glue
  # Runs only after Terraform succeeds
  # ────────────────────────────────────────────────────────────────────────
  ingest:
    name: "2 · Kaggle Ingest → S3 Bronze → Glue"
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Setup Kaggle Credentials on Linux Runner
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Kaggle credentials configured for user: $KAGGLE_USERNAME"
          kaggle --version

      - name: Run Ingestion Script
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          BRONZE_BUCKET_NAME: ${{ needs.terraform.outputs.bronze_bucket }}
          GLUE_WORKFLOW_NAME: ${{ needs.terraform.outputs.glue_workflow }}
          TRIGGER_GLUE:       "true"
        run: python ingestion/ingest.py

  # ────────────────────────────────────────────────────────────────────────
  # JOB 3 — Gold ETL: Trigger Silver-to-Gold PySpark Job & verify Gold S3
  # Runs after Ingest job succeeds
  # ────────────────────────────────────────────────────────────────────────
  gold_etl:
    name: "3 · Silver to Gold ETL → Gold S3 Verification"
    runs-on: ubuntu-latest
    needs: [terraform, ingest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Trigger & Monitor Silver to Gold Glue Job
        run: |
          python ingestion/trigger_gold.py \
            "yelp-bigdata_silver_to_gold" \
            "yelp-bigdata_gold_crawler" \
            "${{ needs.terraform.outputs.gold_bucket    || 'yelp-gold-analytics-us-east-1' }}" \
            "${{ needs.terraform.outputs.silver_crawler || 'yelp-bigdata_silver_crawler' }}" \
            "${{ needs.terraform.outputs.glue_workflow  || 'yelp-bigdata_etl_workflow' }}"

